version: "3.9"

services:
  postgres:
    image: postgres:13
    container_name: farm_postgres
    restart: always
    environment:
      POSTGRES_USER: farmadmin
      POSTGRES_PASSWORD: farm123
      POSTGRES_DB: elegoo_farm
    # No ports exposed to host — backend talks to postgres internally
    volumes:
      - postgres_data:/var/lib/postgresql/data   # ✅ persist DB across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmadmin -d elegoo_farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: farm_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://farmadmin:farm123@postgres:5432/elegoo_farm
      DEV_MODE: "true"
      SECRET_KEY: "4f5f3bd39e4b10bf37ed1227c0673719216d990ff63f4f1a0b3d8ea282e43c64"
    ports:
      - "0.0.0.0:8000:8000"   # ✅ bind to ALL network interfaces
    volumes:
      - file_storage:/app/storage
      - ./frontend/dist:/app/frontend_dist      # ✅ serve built frontend from backend

volumes:
  file_storage:
  postgres_data:     # ✅ postgres data persists across docker-compose down