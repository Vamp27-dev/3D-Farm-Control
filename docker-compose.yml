version: "3.9"

# ✅ All secrets below are read from a local .env file (git-ignored, never
# committed) via ${VARIABLE} interpolation. See .env.example for the
# template — copy it to .env and fill in real values before first run.

services:
  postgres:
    image: postgres:13
    container_name: farm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No ports exposed to host — backend talks to postgres internally
    volumes:
      - postgres_data:/var/lib/postgresql/data   # ✅ persist DB across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: farm_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEV_MODE: "${DEV_MODE:-true}"
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "0.0.0.0:8000:8000"   # ✅ bind to ALL network interfaces
    volumes:
      - file_storage:/app/storage
      - ./frontend/dist:/app/frontend_dist      # ✅ serve built frontend from backend

volumes:
  file_storage:
  postgres_data:     # ✅ postgres data persists across docker-compose down